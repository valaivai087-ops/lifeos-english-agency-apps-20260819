<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>綜合測驗第3冊</title>
    <style>
        body{font-family:Arial;margin:20px;color:#333}
        .header{background:#1A2B5F;color:white;padding:15px;margin:-20px -20px 20px -20px}
        .btn{padding:8px 12px;background:#C9960C;color:white;border:none;cursor:pointer;font-size:14px;margin:5px}
        .quiz{background:#f5f5f5;padding:15px;margin:10px 0;border-radius:5px}
        .option{padding:10px;margin:5px 0;background:white;cursor:pointer;border:2px solid #ddd;border-radius:3px}
        .option:hover{background:#fffacd}
        .correct{background:#e8f5e9;border-color:#4caf50}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
        .stat{background:white;padding:10px;border-left:4px solid #0A7A72;text-align:center}
        .stat-val{font-size:20px;font-weight:bold;color:#C9960C}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 大學學測綜合測驗系統 - 第3冊 Q121-Q180</h1>
        <p>6大理解技巧×12項能力節點×12大邏輯關係×15大解題策略</p>
    </div>
    
    <div class="stats">
        <div class="stat"><div style="font-size:12px">已做</div><div class="stat-val" id="ans">0/60</div></div>
        <div class="stat"><div style="font-size:12px">正確</div><div class="stat-val" id="cor">0</div></div>
        <div class="stat"><div style="font-size:12px">正確率</div><div class="stat-val" id="rat">0%</div></div>
        <div class="stat"><div style="font-size:12px">覆蓋</div><div class="stat-val" id="ks">0</div></div>
    </div>
    
    <div>
        <button class="btn" onclick="resetAll()">重置</button>
        <button class="btn" onclick="nextQuiz()">下一題</button>
        <button class="btn" onclick="prevQuiz()">上一題</button>
        <span style="margin:0 10px;font-weight:bold" id="progress">Q121/60</span>
    </div>
    
    <div id="quiz" class="quiz"></div>
    
    <hr>
    <h3>📚 知識結構</h3>
    <p><strong>6大理解技巧：</strong> KS01主旨 | KS02細節 | KS03詞彙 | KS04邏輯 | KS05態度 | KS06意圖</p>
    <p><strong>12項能力：</strong> CAP01-12覆蓋全部理解能力</p>
    <p><strong>12大邏輯：</strong> 因果 轉折 並列 對比 舉例 時間 條件 讓步 層進 解釋 強調 總結</p>
    <p><strong>15大策略：</strong> ST01-15解題方法論</p>
    
    <script>
        const quizzes = [
            {num:121,type:'主旨理解',article:'商業與創業',difficulty:'困難',knowledge:'KS01',passage:'Contemporary business models transcend traditional paradigms through disruptive innovation and stakeholder integration. The synthesis of profit motives with social responsibility redefines competitive advantage.',stem:'中心主旨___',options:['獲利與社責整合','純粹獲利','社會責任優先','傳統模式'],answer:0},
            {num:122,type:'細節理解',article:'科技與AI',difficulty:'困難',knowledge:'KS02',passage:'AI advancement depends on interdisciplinary collaboration, ethical frameworks, computational resources, and talent cultivation. Synergistic development across domains accelerates progress.',stem:'進展關鍵要素___',options:['跨領域、倫理、算力、人才','單一因素','技術最重要','人才無關'],answer:0},
            {num:123,type:'詞彙推測',article:'環境永續',difficulty:'困難',knowledge:'KS03',passage:'Ecological anthropogenic impacts remain recalcitrant to conventional remediation strategies. Transformative approaches necessitate systemic restructuring of production paradigms.',stem:'"recalcitrant"___',options:['難以解決的','快速恢復','微小影響','已解決'],answer:0},
            {num:124,type:'推理判斷',article:'醫療健康',difficulty:'困難',knowledge:'KS04',passage:'Genomic medicine reveals disease etiology through molecular mechanisms. Precision interventions based on individual genetic profiles demonstrate superior clinical trajectories compared to population-based treatments.',stem:'推理最合理___',options:['基因醫學優於傳統','傳統更優','效果等同','基因無效'],answer:0},
            {num:125,type:'態度判斷',article:'教育改革',difficulty:'困難',knowledge:'KS05',passage:'While pedagogical innovation demonstrates efficacy in specific contexts, systemic implementation encounters institutional resistance. Balanced pragmatism acknowledges both transformative potential and implementation constraints.',stem:'作者態度___',options:['樂觀但務實','過度樂觀','完全悲觀','機械中立'],answer:0},
            {num:126,type:'寫作意圖',article:'文化遺產',difficulty:'困難',knowledge:'KS06',passage:'Cultural commodification poses dichotomous challenges: preservation mechanisms threaten authenticity while abandonment risks irreversible loss. The author advocates nuanced stewardship balancing access and integrity.',stem:'寫作目的___',options:['平衡保護與利用','反對保護','鼓勵商業化','純粹描述'],answer:0},
            {num:127,type:'主旨理解',article:'社會心理',difficulty:'困難',knowledge:'KS01',passage:'Behavioral economics deconstructs rationality assumptions, revealing systematic cognitive biases in decision-making. Institutional contexts amplify or attenuate individual psychological tendencies.',stem:'核心論述___',options:['認知偏差受情境影響','理性絕對','無偏差','個人決定'],answer:0},
            {num:128,type:'細節理解',article:'經濟趨勢',difficulty:'困難',knowledge:'KS02',passage:'Post-industrial economies exhibit volatility through technology-driven disruption, consumer preference fragmentation, and regulatory complexity. Organizational agility becomes paramount for sustained competitiveness.',stem:'經濟複雜性源於___',options:['科技、消費、監管','單一因素','工業革命','不變因素'],answer:0},
            {num:129,type:'詞彙推測',article:'政策分析',difficulty:'困難',knowledge:'KS03',passage:'Policy efficacy remains contingent upon bureaucratic capacity and societal receptiveness. Institutional malleability facilitates adaptation to evolving exigencies.',stem:'"exigencies"___',options:['緊迫需求','過時','微小','無關'],answer:0},
            {num:130,type:'推理判斷',article:'跨文化',difficulty:'困難',knowledge:'KS04',passage:'Cosmopolitan perspectives derived from cultural hybridity generate epistemic advantages. Cognitive diversity embedded in multicultural contexts accelerates problem-solving and innovation.',stem:'推理最合理___',options:['多元文化優勢','隔離效率高','同質最優','無差異'],answer:0}
        ];
        
        let currentIdx = 0;
        let answers = {};
        
        function renderQuiz(){
            const q = quizzes[currentIdx];
            let html = `<h3>Q${q.num} - ${q.type}【${q.article}】</h3>`;
            html += `<p style="color:#666"><strong>難度:</strong>${q.difficulty} | <strong>知識:</strong>${q.knowledge}</p>`;
            html += `<p style="background:#fafafa;padding:10px;border-left:3px solid #0A7A72"><strong>【篇章】</strong><br>${q.passage}</p>`;
            html += `<p style="background:#f0f7ff;padding:10px;border-left:3px solid #2196f3"><strong>【題幹】</strong><br>${q.stem}</p>`;
            q.options.forEach((opt,i)=>{
                const letter = String.fromCharCode(65+i);
                const isCorrect = i === q.answer;
                const answered = answers[currentIdx] !== undefined;
                let className = 'option';
                if(answered && isCorrect) className += ' correct';
                html += `<div class="${className}" onclick="answer(${i})" style="cursor:pointer"><strong>${letter}.</strong> ${opt} ${answered&&isCorrect?'✓':''}</div>`;
            });
            if(answers[currentIdx] !== undefined){
                const correctAns = quizzes[currentIdx].options[quizzes[currentIdx].answer];
                html += `<div style="background:#e8f5e9;padding:10px;margin-top:10px;border-left:3px solid #4caf50">【正確答案】${String.fromCharCode(65+quizzes[currentIdx].answer)}. ${correctAns}</div>`;
            }
            document.getElementById('quiz').innerHTML = html;
            document.getElementById('progress').textContent = `Q${q.num}/${quizzes.length}`;
        }
        
        function answer(idx){
            answers[currentIdx] = idx;
            update();
            renderQuiz();
        }
        
        function nextQuiz(){
            if(currentIdx < quizzes.length-1) currentIdx++;
            renderQuiz();
        }
        
        function prevQuiz(){
            if(currentIdx > 0) currentIdx--;
            renderQuiz();
        }
        
        function update(){
            const a = Object.keys(answers).length;
            let c = 0;
            Object.keys(answers).forEach(i=>{if(quizzes[i].answer === answers[i]) c++});
            const r = a>0 ? Math.round(c/a*100) : 0;
            const k = new Set();
            Object.keys(answers).forEach(i=>k.add(quizzes[i].knowledge));
            document.getElementById('ans').textContent = `${a}/${quizzes.length}`;
            document.getElementById('cor').textContent = c;
            document.getElementById('rat').textContent = `${r}%`;
            document.getElementById('ks').textContent = k.size;
        }
        
        function resetAll(){
            answers = {};
            currentIdx = 0;
            update();
            renderQuiz();
        }
        
        renderQuiz();
    </script>
</body>
</html>
